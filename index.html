body{background:var(--bg);color:var(--fg);font:16px/1.5 var(--sans);padding-block:12px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:860px;margin:0 auto;display:flex;flex-direction:column;gap:14px}

.cat{color:var(--cat)}.an{color:var(--an)}

/* ---------- helpers ---------- */
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const rnd=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function fmt(s){let o='',i=0;while(i<s.length){const c=s[i];if(c==='^'){const j=s.indexOf('^',i+1);o+='<sup>'+esc(s.slice(i+1,j).replace(/-/g,'−'))+'</sup>';i=j+1;continue}
if(/\d/.test(c)&&i>0&&/[A-Za-z)\]]/.test(s[i-1])){o+='<sub>'+c+'</sub>';i++;continue}o+=esc(c);i++}return o}
const plain=s=>s.replace(/\^/g,'');
const FX=f=>'<span class="fx">'+fmt(f)+'</span>';
function normF(s){s=s.replace(/[₀-₉]/g,c=>String(c.charCodeAt(0)-0x2080)).replace(/[−‒–]/g,'-').replace(/\^/g,'').replace(/\s+/g,'').replace(/[.*•]/g,'·');
const m=s.match(/^(.*?)([+-])(\d)$/);if(m)s=m[1]+m[3]+m[2];return s}
const normT=s=>s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]/g,'');
const isDesc=a=>/^vizes|=/.test(a);
const secT=id=>SECS.find(s=>s.id===id);
const lsGet=(k,d)=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};

/* ---------- data ---------- */
const E=RAW.trim().split('\n').map((l,i)=>{const p=l.split('|');return{id:i,sec:p[0],names:(p[1]||'').split(' // ').filter(Boolean),f:p[2],cs:(p[3]||'').split(', ').filter(Boolean),h:p[4]||'',mix:p[5]==='m'}});
const G={dir:'mix',sel:new Set(lsGet('kn_sel',SECS.map(s=>s.id)))};
let M=lsGet('kn_m',{});
const mark=(id,ok)=>{const m=M[id]||(M[id]={ok:0,bad:0});ok?m.ok++:m.bad++;lsSet('kn_m',M);known()};
const isKnown=id=>{const m=M[id];return m&&m.ok-m.bad>=2};
const pool=()=>{const p=E.filter(e=>G.sel.has(e.sec));return p.length?p:E};

/* ---------- tasks ---------- */
const DIRS={mix:'Vegyes',n2f:'Név → képlet',f2n:'Képlet → név',c2f:'Hétköznapi név → képlet',f2c:'Képlet → hétköznapi név'};
const avail=(e,d)=>d==='n2f'||d==='f2n'?e.names.length>0:e.cs.length>0;
function mk(e,dir,noMix){
 if(noMix&&e.mix)return null;
 if(dir==='mix'){const a=['n2f','f2n','c2f','f2c'].filter(d=>avail(e,d));if(!a.length)return null;dir=rnd(a)}
 else if(!avail(e,dir))return null;
 const t={e,dir,sec:secT(e.sec)};
 if(dir==='n2f'){t.q=esc(e.names[0]);t.qk='nev';t.a=[plain(e.f)];t.ak='formula';t.shown=FX(e.f)}
 if(dir==='f2n'){t.q=FX(e.f);t.qk='formula';t.a=e.names;t.ak='nev';t.shown=esc(e.names[0])}
 if(dir==='c2f'){const a=e.cs.filter(x=>!isDesc(x));t.q=esc(rnd(a.length?a:e.cs));t.qk='nev';t.a=[plain(e.f)];t.ak='formula';t.shown=FX(e.f)}
 if(dir==='f2c'){t.q=FX(e.f);t.qk='formula';t.a=e.cs;t.ak='nev';t.shown=esc(e.cs.slice(0,2).join(', '))}
 t.key=t.shown;return t}
const tasks=(noMix)=>pool().map(e=>mk(e,G.dir,noMix)).filter(Boolean);
function distract(t,n){const cand=shuffle(E.filter(e=>e.id!==t.e.id)).sort((a,b)=>(b.sec===t.e.sec)-(a.sec===t.e.sec)||Math.random()-.5);
 const out=[],seen=new Set([t.key]);const acc=t.a.map(normT);
 for(const e of cand){const d=mk(e,t.dir);if(!d||seen.has(d.key))continue;if(d.a.some(x=>acc.includes(normT(x))))continue;seen.add(d.key);out.push(d);if(out.length>=n)break}return out}
function tips(t){const e=t.e,L=[];L.push('Témakör: <b>'+esc(t.sec.t)+'</b>. '+esc(t.sec.h));
 if(e.h)L.push(esc(e.h));
 const ans=t.ak==='formula'?plain(t.e.f):t.a[0];
 if(t.ak==='formula'){const k=Math.ceil(ans.length/2);L.push('Az első fele: <span class="fx">'+esc(ans.slice(0,k))+'…</span> (összesen '+ans.length+' karakter)')}
 else L.push('Így kezdődik: <b>'+esc(ans.slice(0,3))+'…</b> ('+ans.length+' karakter)');
 return L}
function check(t,v){const n=t.ak==='formula'?normF:normT;return t.a.some(x=>n(x)===n(v))}
/* shared tip widget */
function tipWidget(box,btn,list,onUse){let k=0;btn.onclick=()=>{if(k<list.length){const d=document.createElement('div');d.innerHTML='💡 '+list[k];box.appendChild(d);k++;onUse&&onUse(k)}if(k>=list.length)btn.disabled=true};
 btn.textContent='Tipp';return()=>k}

/* ---------- header ---------- */
function known(){const c=E.filter(e=>isKnown(e.id)).length;$('#known').textContent='Ismert: '+c+' / '+E.length}
function filters(){$('#secsum').textContent='Témakör ('+(G.sel.size===SECS.length?'mind':G.sel.size)+')';
 const b=$('#secbox');b.innerHTML='<div class="row"><button class="btn" data-a="all">Mind</button><button class="btn" data-a="none">Egyik sem</button></div>'+
 SECS.map(s=>'<label><input type="checkbox" value="'+s.id+'"'+(G.sel.has(s.id)?' checked':'')+'> '+esc(s.t)+' <span class="muted small">('+E.filter(e=>e.sec===s.id).length+')</span></label>').join('');
 b.onchange=ev=>{ev.target.checked?G.sel.add(ev.target.value):G.sel.delete(ev.target.value);lsSet('kn_sel',[...G.sel]);$('#secsum').textContent='Témakör ('+(G.sel.size===SECS.length?'mind':G.sel.size)+')';route()};
 b.onclick=ev=>{const a=ev.target.dataset.a;if(!a)return;G.sel=a==='all'?new Set(SECS.map(s=>s.id)):new Set();lsSet('kn_sel',[...G.sel]);filters();route()}}

/* ---------- tabs ---------- */
const TABS=[['logika','Logika'],['tananyag','Tananyag'],['flash','Flashcard'],['kviz','Kvíz'],['beiras','Beírás'],['parositas','Párosítás'],['ionkirako','Ionkirakó'],['savbol','Savból anion'],['toltes','Töltések'],['igazhamis','Igaz / hamis']];
const R={};
function route(){const h=(location.hash||'#logika').slice(1);const id=R[h]?h:'logika';
 $('#tabs').innerHTML=TABS.map(([i,t])=>'<a href="#'+i+'"'+(i===id?' aria-current="page"':'')+'>'+t+'</a>').join('');

/* ---------- Logika ---------- */
R.logika=v=>{v.innerHTML=`<div class="card"><h2>Mi az ion?</h2>
<p>Az ion töltéssel rendelkező atom vagy atomcsoport. A <b class="cat">kation</b> (pozitív) elektront adott le, az <b class="an">anion</b> (negatív) elektront vett fel. Az atomok akkor stabilak, ha a legkülső héjuk tele van.</p>

<div class="mini"><h3>Összetett anion a savból</h3><p>Vedd el a savból a H⁺-okat:<br>H₂SO₄ → HSO₄⁻ → SO₄²⁻<br>H₃PO₄ → H₂PO₄⁻ → HPO₄²⁻ → PO₄³⁻<br><b>-sav → -át</b>, <b>-os sav → -it</b> (eggyel kevesebb O).</p></div>
<div class="mini"><h3>Klór-oxoanionok</h3><p>Az oxigének száma csökken:<br>ClO₄⁻ perklorát<br>ClO₃⁻ klorát<br>ClO₂⁻ klorit<br>OCl⁻ hipoklorit</p></div>
<div class="mini"><h3>Képlet kirakása</h3><p>A töltések összege nulla.<br>Al³⁺ + SO₄²⁻ → Al₂(SO₄)₃ (2·3 = 3·2)<br>Ca²⁺ + OH⁻ → Ca(OH)₂<br>Az összetett iont zárójelbe tesszük, ha egynél több kell.</p></div>
<div class="mini"><h3>Előtagok</h3><p>mono 1, di 2, tri 3, tetra 4, penta 5, hexa 6.<br>hidrogén- / dihidrogén-: hány H maradt.<br>A névből kiolvasható a képlet: kálium-hexaciano-ferrát(II) = K + 6 CN + Fe(II).</p></div>
<div class="mini"><h3>Hétköznapi nevek csoportjai</h3><p><b>Gálicok</b>: kristályvizes fém-szulfát. Zöld = Fe, kék = Cu, fehér = Zn.<br><b>Lúgok</b>: nátronlúg NaOH, kálilúg KOH.<br><b>Vérlúgsó</b>: sárga = Fe(II), vörös = Fe(III).<br><b>Higany</b>: szublimát HgCl₂, kalomel Hg₂Cl₂.<br><b>Ásványok</b>: gyakran -it végűek, anion szerint csoportosíthatók.</p></div></div>
<p class="muted small">Javasolt sorrend: Töltések → Savból anion → Ionkirakó → Tananyag olvasása → Flashcard → Kvíz → Beírás. A Tipp gomb mindenhol csak kérésre ad segítséget.</p></div>`};

 const draw=()=>{let h='';for(const s of SECS){if(!G.sel.has(s.id)&&G.sel.size)continue;const rows=E.filter(e=>e.sec===s.id&&(!q||(e.names.join(' ')+plain(e.f)+e.cs.join(' ')).toLowerCase().includes(q)));if(!rows.length)continue;
 h+='<tr class="sh"><td colspan="3">'+esc(s.t)+'</td></tr>';

/* ---------- Flashcard ---------- */
R.flash=v=>{let q=shuffle(tasks()),total=q.length,done=0,flipped=false;
 const draw=()=>{if(!q.length){v.innerHTML='<div class="card"><h2>Kész, a pakli elfogyott.</h2><p>Minden kártyát tudtál ebben a körben. Ismert tételek: '+E.filter(e=>isKnown(e.id)).length+' / '+E.length+'.</p><div class="row"><button class="btn primary" id="again">Új kör</button></div></div>';$('#again').onclick=()=>R.flash(v);return}
 const t=q[0],e=t.e;flipped=false;
 v.innerHTML='<div class="card"><div class="row" style="justify-content:space-between"><span class="lab">'+esc(t.sec.t)+'</span><span class="muted small">hátra: '+q.length+' · irány: '+DIRS[t.dir]+'</span></div><div class="bar"><i style="width:'+(100*done/total)+'%"></i></div><div class="flip"><div class="big">'+t.q+'</div></div><div class="tipbox" id="tb"></div><div id="back"></div><div class="row" id="ctl"><button class="btn primary" id="fl">Mutasd a választ</button><button class="btn tip" id="tp"></button></div></div>';
 const getTip=tipWidget($('#tb'),$('#tp'),tips(t));
 $('#fl').onclick=()=>{flipped=true;$('#back').innerHTML='<div class="back"><div class="big">'+t.shown+'</div><p class="muted small">'+(e.names.length?esc(e.names.join(' / '))+'<br>':'')+FX(e.f)+(e.cs.length?'<br>'+esc(e.cs.join(', ')):'')+'</p>'+(e.h?'<p class="small">'+esc(e.h)+'</p>':'')+'</div>';
  $('#ctl').innerHTML='<button class="btn ok" id="y">Tudtam</button><button class="btn bad" id="n">Nem tudtam</button>';
  $('#y').onclick=()=>{mark(e.id,true);q.shift();done++;draw()};
  $('#n').onclick=()=>{mark(e.id,false);q.shift();q.splice(Math.min(4,q.length),0,t);draw()}}};
 draw()};
/* ---------- multiple-choice runner (10 questions per round) ---------- */
function mcRunner(v,title,gen,sub){let n=0,ok=0,streak=0;const N=10;
 const next=()=>{if(n>=N){v.innerHTML='<div class="card"><h2>Kör vége: '+ok+' / '+N+'</h2><div class="bar"><i style="width:'+(100*ok/N)+'%"></i></div><p>'+(ok>=9?'Kiváló.':ok>=7?'Jó, a hibásakat érdemes még átnézni.':'Még gyakorolj, és használd bátran a Tippet.')+'</p><div class="row"><button class="btn primary" id="rs">Új kör</button></div></div>';$('#rs').onclick=()=>mcRunner(v,title,gen,sub);return}
 const it=gen();let tipsUsed=0,answered=false;
 v.innerHTML='<div class="card"><div class="row" style="justify-content:space-between"><h2 style="margin:0">'+title+'</h2><span class="stat muted small"><span>'+(n+1)+' / '+N+'</span><span>pont: '+ok+'</span><span>sorozat: '+streak+'</span></span></div>'+(sub?'<p class="muted small">'+sub+'</p>':'')+'<div class="big">'+it.q+'</div><div class="opts" id="o">'+it.opts.map((o,i)=>'<button class="opt" data-i="'+i+'">'+o.html+'</button>').join('')+'</div><div class="tipbox" id="tb"></div><div id="fb"></div><div class="row" id="ctl"><button class="btn tip" id="tp"></button></div></div>';
 const list=it.tips.slice();let fifty=it.opts.length>2;const all=(fifty?['50']:[]).concat(list);let k=0;
 const tp=$('#tp');tp.textContent='Tipp';
 tp.onclick=()=>{if(answered)return;const x=all[k++];tipsUsed++;
  if(x==='50'){const wr=shuffle(it.opts.map((o,i)=>i).filter(i=>!it.opts[i].ok)).slice(0,Math.max(1,it.opts.length-2));wr.forEach(i=>{const b=$('.opt[data-i="'+i+'"]');b.classList.add('gone');b.disabled=true});const d=document.createElement('div');d.textContent='💡 Két rossz választ kiszürkítettem.';$('#tb').appendChild(d)}
  else{const d=document.createElement('div');d.innerHTML='💡 '+x;$('#tb').appendChild(d)}
  if(k>=all.length)tp.disabled=true};
 $('#o').onclick=ev=>{const b=ev.target.closest('.opt');if(!b||answered||b.disabled)return;answered=true;const o=it.opts[+b.dataset.i];
  document.querySelectorAll('.opt').forEach((x,i)=>{x.disabled=true;if(it.opts[i].ok)x.classList.add('right')});
  if(o.ok){ok+=tipsUsed?0.5:1;streak++;$('#fb').innerHTML='<div class="fb ok">Helyes.'+(tipsUsed?' (Tippel fél pont.)':'')+(it.why?' '+it.why:'')+'</div>'}
  else{b.classList.add('wrong');streak=0;$('#fb').innerHTML='<div class="fb bad">Nem ez a helyes válasz.'+(it.why?' '+it.why:'')+'</div>'}
  if(it.onAns)it.onAns(o.ok);n++;tp.disabled=true;$('#ctl').innerHTML='<button class="btn primary" id="nx">'+(n>=N?'Eredmény':'Következő')+'</button>';$('#nx').onclick=next};
 };next()}

/* ---------- Kvíz ---------- */
R.kviz=v=>{const T=tasks();if(!T.length){v.innerHTML='<div class="card">Nincs feladat a kijelölt témakörben.</div>';return}
 mcRunner(v,'Kvíz',()=>{const t=rnd(T),d=distract(t,3);return{q:t.q+'<div class="muted small" style="font-size:.85rem">'+(t.ak==='formula'?'Melyik a képlete?':'Mi a neve?')+'</div>',
  opts:shuffle([{html:t.shown,ok:true}].concat(d.map(x=>({html:x.shown,ok:false})))),tips:tips(t),why:t.e.h?esc(t.e.h):'',onAns:ok=>mark(t.e.id,ok)}},'Irány: '+DIRS[G.dir]+'. A Tipp először két rossz választ szűr ki.')};

/* ---------- Igaz / hamis ---------- */
R.igazhamis=v=>{const T=tasks();if(T.length<2){v.innerHTML='<div class="card">Nincs elég feladat.</div>';return}
 mcRunner(v,'Igaz vagy hamis?',()=>{const t=rnd(T);const truth=Math.random()<.5;let shown=t.shown;if(!truth){const d=distract(t,1)[0];if(d)shown=d.shown;else truth=true}
  const lead=t.dir==='n2f'||t.dir==='c2f'?t.q+' képlete':t.dir==='f2n'?t.q+' neve':t.q+' hétköznapi neve';
  return{q:'<div class="small muted">Állítás</div>'+lead+' = '+shown,opts:[{html:'Igaz',ok:truth},{html:'Hamis',ok:!truth}],tips:tips(t),
  why:'Helyesen: '+t.shown+'.',onAns:ok=>mark(t.e.id,ok)}},'Döntsd el, igaz-e az állítás.')};

/* ---------- Töltések ---------- */
const CH=[['Na','I',1],['K','I',1],['H','I',1],['Mg','II',2],['Ca','II',2],['Ba','II',2],['Al','III',3],['F','VII',-1],['Cl','VII',-1],['Br','VII',-1],['I','VII',-1],['O','VI',-2],['S','VI',-2]];
const zs=z=>(z>0?'+':'−')+Math.abs(z);
R.toltes=v=>{mcRunner(v,'Mekkora a töltése az ionnak?',()=>{const c=rnd(CH),[el,g,z]=c;const names={H:'hidrogén'};
 const opts=[1,2,3,-1,-2].filter(x=>x!==z);const o=shuffle(opts).slice(0,3).concat([z]);
 return{q:'<span class="fx">'+el+'</span><div class="small muted" style="font-size:.85rem">főcsoport: '+g+'.</div>',opts:shuffle(o).map(x=>({html:zs(x),ok:x===z})),
 tips:['Az I–III. főcsoportban a főcsoport száma az <b>elektronok leadásával</b> keletkező pozitív töltés.','A VI. és VII. főcsoportban 8 mínusz a főcsoport száma az <b>felvett</b> elektronok száma, így a töltés negatív.'],why:'A '+el+' a '+g+'. főcsoportban van: '+zs(z)+'.'}},'A periódusos rendszer főcsoportjából következtetsz.')};

/* ---------- Savból anion ---------- */
const AC=[['HF','folysav',1,'F^-^','fluorid'],['HCl','sósav',1,'Cl^-^','klorid'],['H2S','kénhidrogén',1,'HS^-^','hidrogén-szulfid'],['H2S','kénhidrogén',2,'S^2-^','szulfid'],
['H2SO4','kénsav',1,'HSO4^-^','hidrogén-szulfát'],['H2SO4','kénsav',2,'SO4^2-^','szulfát'],['H2SO3','kénessav',1,'HSO3^-^','hidrogén-szulfit'],['H2SO3','kénessav',2,'SO3^2-^','szulfit'],
['HNO3','salétromsav',1,'NO3^-^','nitrát'],['HNO2','salétromossav',1,'NO2^-^','nitrit'],['H3PO4','foszforsav',1,'H2PO4^-^','dihidrogén-foszfát'],['H3PO4','foszforsav',2,'HPO4^2-^','hidrogén-foszfát'],['H3PO4','foszforsav',3,'PO4^3-^','foszfát'],
['H2CO3','szénsav',1,'HCO3^-^','hidrogén-karbonát'],['H2CO3','szénsav',2,'CO3^2-^','karbonát'],['HClO4','perklórsav',1,'ClO4^-^','perklorát'],['HClO3','klórsav',1,'ClO3^-^','klorát'],['HClO2','klórossav',1,'ClO2^-^','klorit'],
['HOCl','hipoklórossav',1,'OCl^-^','hipoklorit'],['HCN','kéksav',1,'CN^-^','cianid'],['H2SiO3','kovasav',2,'SiO3^2-^','szilikát'],['H2O','víz',1,'OH^-^','hidroxid']];
R.savbol=v=>{mcRunner(v,'Savból anion',()=>{const it=rnd(AC),[a,an,n,ion,iname]=it;const rev=Math.random()<.3;
 const dist=shuffle(AC.filter(x=>x[3]!==ion)).filter((x,i,arr)=>arr.findIndex(y=>y[3]===x[3])===i).slice(0,3);
 if(!rev)return{q:FX(a)+' <span class="muted small" style="font-size:.85rem">('+esc(an)+')</span><div class="small muted" style="font-size:.85rem">lead '+n+' H<sup>+</sup>-t. Melyik ion keletkezik?</div>',
  opts:shuffle([{html:FX(ion)+' <span class="muted small">'+esc(iname)+'</span>',ok:true}].concat(dist.map(x=>({html:FX(x[3])+' <span class="muted small">'+esc(x[4])+'</span>',ok:false})))),
  tips:['Vedd el a savmolekulából a H-ket: a töltés annyi, ahány H<sup>+</sup>-t leadott ('+n+').','Ha a név <b>-át</b> végű, az egy anion az -sav sóiból; a „hidrogén-" előtag azt jelzi, hogy maradt H.'],why:FX(a)+' − '+n+' H⁺ = '+FX(ion)+' ('+esc(iname)+').'};
 const dA=shuffle(AC.filter(x=>x[0]!==a)).filter((x,i,arr)=>arr.findIndex(y=>y[0]===x[0])===i).slice(0,3);
 return{q:FX(ion)+'<div class="small muted" style="font-size:.85rem">'+esc(iname)+'ion. Melyik savból keletkezik?</div>',opts:shuffle([{html:FX(a)+' <span class="muted small">'+esc(an)+'</span>',ok:true}].concat(dA.map(x=>({html:FX(x[0])+' <span class="muted small">'+esc(x[1])+'</span>',ok:false})))),
  tips:['Add vissza az ionnak a H<sup>+</sup>-okat, amíg semleges nem lesz.','A töltés abszolút értéke a hozzáadandó H száma ('+n+').'],why:FX(ion)+' + '+n+' H⁺ = '+FX(a)+'.'}},'Vedd el a savból a H⁺-okat, vagy fordítva.')};

/* ---------- Beírás ---------- */
R.beiras=v=>{const T=tasks(true);if(!T.length){v.innerHTML='<div class="card">Nincs feladat a kijelölt témakörben.</div>';return}
 let q=shuffle(T),ok=0,n=0,streak=0;
 const next=()=>{if(!q.length)q=shuffle(T);const t=q.shift();let done=false;
  v.innerHTML='<div class="card"><div class="row" style="justify-content:space-between"><span class="lab">'+esc(t.sec.t)+'</span><span class="stat muted small"><span>jó: '+ok+' / '+n+'</span><span>sorozat: '+streak+'</span></span></div><div class="big">'+t.q+'</div><p class="muted small">'+(t.ak==='formula'?'Írd be a képletet. Töltés: SO4^2- vagy SO42-, kristályvíz: · vagy pont, pl. CuSO4.5H2O.':'Írd be a nevet. Az ékezetek nem számítanak.')+'</p><input type="text" id="in" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Válasz"><div class="tipbox" id="tb"></div><div id="fb"></div><div class="row" id="ctl"><button class="btn primary" id="ck">Ellenőrzés</button><button class="btn tip" id="tp"></button><button class="btn" id="gv">Feladom</button></div></div>';
  const inp=$('#in');inp.focus();const tl=tips(t);const getTip=tipWidget($('#tb'),$('#tp'),tl);
  const fin=good=>{done=true;n++;if(good){ok++;streak++}else streak=0;mark(t.e.id,good);$('#ctl').innerHTML='<button class="btn primary" id="nx">Következő</button>';$('#nx').onclick=next;$('#nx').focus()};
  $('#ck').onclick=()=>{if(done||!inp.value.trim())return;if(check(t,inp.value)){const pen=getTip();$('#fb').innerHTML='<div class="fb ok">Helyes: '+t.shown+(t.e.h?'<br><span class="small">'+esc(t.e.h)+'</span>':'')+'</div>';inp.disabled=true;fin(true)}else{$('#fb').innerHTML='<div class="fb bad">Még nem jó. Próbáld újra, vagy kérj Tippet.</div>';inp.classList.add('shake');setTimeout(()=>inp.classList.remove('shake'),300)}};
  $('#gv').onclick=()=>{if(done)return;$('#fb').innerHTML='<div class="fb bad">A helyes válasz: '+t.shown+(t.e.h?'<br><span class="small">'+esc(t.e.h)+'</span>':'')+'</div>';inp.disabled=true;fin(false)};
  inp.onkeydown=ev=>{if(ev.key==='Enter'){ev.preventDefault();done?next():$('#ck').click()}}};
 next()};

/* ---------- Párosítás ---------- */
R.parositas=v=>{const T=tasks();if(T.length<3){v.innerHTML='<div class="card">Nincs elég feladat.</div>';return}
 const round=()=>{const used=new Set(),P=[];for(const t of shuffle(T)){if(P.length>=6)break;if(used.has(t.key)||P.some(p=>normT(p.q.replace(/<[^>]+>/g,''))===normT(t.q.replace(/<[^>]+>/g,''))))continue;used.add(t.key);P.push(t)}
  const L=P.map((t,i)=>({i,h:t.q})),Rt=shuffle(P.map((t,i)=>({i,h:t.shown})));let sel=null,left=P.length,miss=0;
  v.innerHTML='<div class="card"><div class="row" style="justify-content:space-between"><h2 style="margin:0">Párosítás</h2><span class="muted small" id="st"></span></div><p class="muted small">Kattints egy bal oldali elemre, majd a párjára. Irány: '+DIRS[G.dir]+'.</p><div class="pair"><div id="l">'+L.map(x=>'<button class="opt pc" data-s="l" data-i="'+x.i+'">'+x.h+'</button>').join('')+'</div><div id="r">'+Rt.map(x=>'<button class="opt pc" data-s="r" data-i="'+x.i+'">'+x.h+'</button>').join('')+'</div></div><div class="tipbox" id="tb"></div><div id="fb"></div><div class="row" id="ctl"><button class="btn tip" id="tp">Tipp</button></div></div>';
  const st=()=>$('#st').textContent='hátra: '+left+' · hiba: '+miss;st();
  $('#tp').onclick=()=>{const cand=sel!==null?sel:+rnd([...document.querySelectorAll('#l .pc:not(.done)')]).dataset.i;document.querySelectorAll('.pc.hint').forEach(x=>x.classList.remove('hint'));const lb=$('#l .pc[data-i="'+cand+'"]'),rb=$('#r .pc[data-i="'+cand+'"]');lb.classList.add('hint');rb.classList.add('hint');$('#tb').innerHTML='💡 A szaggatott keretes két elem összetartozik. '+(P[cand].e.h?esc(P[cand].e.h):'');miss+=0.5;st()};
  v.onclick=ev=>{const b=ev.target.closest('.pc');if(!b)return;const s=b.dataset.s,i=+b.dataset.i;
   if(s==='l'){document.querySelectorAll('#l .pc').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');sel=i;return}
   if(sel===null)return;
   if(sel===i){b.classList.add('done');$('#l .pc[data-i="'+i+'"]').classList.add('done');$('#l .pc[data-i="'+i+'"]').classList.remove('sel','hint');b.classList.remove('hint');mark(P[i].e.id,true);sel=null;left--;st();
    if(!left)$('#fb').innerHTML='<div class="fb ok">Mind párban. Hibapont: '+miss+'.</div>',$('#ctl').innerHTML='<button class="btn primary" id="nr">Új kör</button>',$('#nr').onclick=round}
   else{miss++;mark(P[sel].e.id,false);b.classList.add('shake');setTimeout(()=>b.classList.remove('shake'),300);st()}}};
 round()};

/* ---------- Ionkirakó ---------- */
const IONS=E.filter(e=>e.sec==='ion').map(e=>{const f=e.f,m=f.match(/^(.*)\^(\d?)([+-])\^$/),base=m[1],z=(m[2]?+m[2]:1)*(m[3]==='+'?1:-1);
 return{e,f,base,z,poly:!/^[A-Z][a-z]?$/.test(base),skip:/^([A-Z][a-z]?)2$/.test(base),stem:e.names[0].replace(/-?ion$/,'')}}).filter(i=>!i.skip);
const CAT=IONS.filter(i=>i.z>0),ANI=IONS.filter(i=>i.z<0);
const gcd=(a,b)=>b?gcd(b,a%b):a;
const unit=(i,n)=>n===1?i.base:(i.poly?'('+i.base+')'+n:i.base+n);
R.ionkirako=v=>{let st={ok:0,n:0};
 const next=()=>{const c=rnd(CAT),a=rnd(ANI);const g=gcd(Math.abs(c.z),Math.abs(a.z)),nc=Math.abs(a.z)/g,na=Math.abs(c.z)/g;let vc=1,va=1,done=false;
  v.innerHTML='<div class="card"><div class="row" style="justify-content:space-between"><h2 style="margin:0">Ionkirakó</h2><span class="muted small">jó: '+st.ok+' / '+st.n+'</span></div><p>Rakd ki a(z) <b>'+esc(c.stem+'-'+a.stem)+'</b> képletét. A vegyület kifelé semleges, a töltések összege nulla.</p>'+
  '<div class="ionrow"><div class="ion c"><span class="lab" style="color:inherit">kation</span><span class="big" style="padding:0">'+FX(c.f)+'</span><span class="small">'+esc(c.stem)+'</span><div class="step"><button class="btn" id="cm" aria-label="kevesebb kation">−</button><b id="cn">1</b><button class="btn" id="cp" aria-label="több kation">+</button></div></div>'+
  '<div class="ion a"><span class="lab" style="color:inherit">anion</span><span class="big" style="padding:0">'+FX(a.f)+'</span><span class="small">'+esc(a.stem)+'</span><div class="step"><button class="btn" id="am" aria-label="kevesebb anion">−</button><b id="an">1</b><button class="btn" id="ap" aria-label="több anion">+</button></div></div></div>'+
  '<div class="big"><span id="pv"></span><div class="small muted" id="sum" style="font-size:.9rem"></div></div><div class="tipbox" id="tb"></div><div id="fb"></div><div class="row" id="ctl"><button class="btn primary" id="ck">Ellenőrzés</button><button class="btn tip" id="tp"></button><button class="btn" id="gv">Feladom</button></div></div>';
  const upd=()=>{$('#cn').textContent=vc;$('#an').textContent=va;$('#pv').innerHTML='<span class="fx">'+fmt(unit(c,vc))+fmt(unit(a,va))+'</span>';const s=vc*c.z+va*a.z;$('#sum').textContent=vc+'·('+zs(c.z)+') + '+va+'·('+zs(a.z)+') = '+(s>0?'+':s<0?'−':'')+Math.abs(s)+(s===0?'  ✓ semleges':'')};upd();
  const bind=(id,f)=>$('#'+id).onclick=()=>{if(done)return;f();vc=Math.max(1,Math.min(9,vc));va=Math.max(1,Math.min(9,va));upd()};
  bind('cm',()=>vc--);bind('cp',()=>vc++);bind('am',()=>va--);bind('ap',()=>va++);
  tipWidget($('#tb'),$('#tp'),['A kation és az anion töltésének összege nulla. Nézd az alsó sort: addig változtasd a darabszámot, amíg 0 nem lesz.','Töltések: '+FX(c.f)+' és '+FX(a.f)+'. Keresd a legkisebb közös többszöröst: '+(Math.abs(c.z)*Math.abs(a.z)/g)+'.','Több anionnál az összetett iont zárójelbe tesszük, pl. Ca(OH)₂. Legkisebb számokat használd (pl. nem Ca₂(OH)₄).']);
  const fin=g=>{done=true;st.n++;if(g)st.ok++;$('#ctl').innerHTML='<button class="btn primary" id="nx">Következő</button>';$('#nx').onclick=next};
  $('#ck').onclick=()=>{if(done)return;const s=vc*c.z+va*a.z;if(vc===nc&&va===na){$('#fb').innerHTML='<div class="fb ok">Helyes: '+FX(unit(c,nc)+unit(a,na))+'</div>';fin(true)}
   else{$('#fb').innerHTML='<div class="fb bad">'+(s!==0?'A töltések összege még nem nulla.':'A töltések kiegyenlítettek, de van kisebb egész számpár is.')+'</div>'}};
  $('#gv').onclick=()=>{if(done)return;vc=nc;va=na;upd();$('#fb').innerHTML='<div class="fb bad">A helyes képlet: '+FX(unit(c,nc)+unit(a,na))+'</div>';fin(false)}};
 next()};

/* ---------- init ---------- */
$('#dir').innerHTML=Object.entries(DIRS).map(([k,t])=>'<option value="'+k+'">'+t+'</option>').join('');
$('#dir').onchange=ev=>{G.dir=ev.target.value;route()};
addEventListener('hashchange',route);filters();known();route();
</script>

</body></html>
